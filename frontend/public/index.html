<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SkyLens – AI Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────────────── -->
<header class="header">
  <div class="logo">
    <span class="logo-icon">◈</span>
    <span class="logo-text">SkyLens</span>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="City name or ZIP code…" autocomplete="off"/>
      <button id="locBtn" title="Use my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <div id="suggestions" class="suggestions hidden"></div>
  </div>
  <div class="unit-toggle">
    <button id="btnC" class="unit-btn active">°C</button>
    <button id="btnF" class="unit-btn">°F</button>
  </div>
</header>

<!-- ── MAIN ──────────────────────────────────────────────────────────────── -->
<main class="main-grid" id="app">

  <!-- Loading -->
  <div class="loading hidden" id="loading">
    <div class="spinner"></div>
    <p>Reading the atmosphere…</p>
  </div>

  <!-- Error -->
  <div class="error-msg hidden" id="errorMsg"></div>

  <!-- ── HERO: Current ─────────────────────────────────────────────────── -->
  <section class="card hero-card" id="heroCard">
    <div class="hero-left">
      <div class="location-line">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        <span id="heroCity">–</span>
        <span class="country-tag" id="heroCountry"></span>
      </div>
      <div class="hero-temp" id="heroTemp">–</div>
      <div class="hero-desc" id="heroDesc">–</div>
      <div class="hero-hl">
        <span>H: <strong id="heroHigh">–</strong></span>
        <span>L: <strong id="heroLow">–</strong></span>
        <span>Feels: <strong id="heroFeels">–</strong></span>
      </div>
      <div class="last-updated" id="lastUpdated"></div>
    </div>
    <div class="hero-right">
      <img id="heroIcon" src="" alt="" class="weather-icon-xl"/>
      <div class="sun-times">
        <div class="sun-item">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 11H1v2h3v-2zm9-9h-2v2.99h2V2zm7.45 3.46l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 11v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
          <span id="sunrise">–</span>
        </div>
        <div class="sun-item">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 19.95V22h2v-2.05c-.33.03-.66.05-1 .05s-.67-.02-1-.05zM4.22 18.78l-1.42 1.42 1.42 1.41 1.41-1.41-1.41-1.42zM3 12c0 .34.02.67.05 1H1.05C1.02 12.67 1 12.34 1 12s.02-.67.05-1h1.99C3.02 11.33 3 11.66 3 12zm17.95-1c.03.33.05.66.05 1s-.02.67-.05 1h-1.99c.03-.33.05-.66.05-1s-.02-.67-.05-1h1.99zM4.22 5.22L2.81 3.81 4.22 2.4l1.41 1.41L4.22 5.22zM18 12c0 3.31-2.69 6-6 6-2.96 0-5.43-2.15-5.91-4.97l-.03-.03H4.05C4.52 16.6 7.96 20 12 20c4.42 0 8-3.58 8-8s-3.58-8-8-8v2c3.31 0 6 2.69 6 6z"/></svg>
          <span id="sunset">–</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ── STAT CARDS ─────────────────────────────────────────────────────── -->
  <section class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-label">Humidity</div>
      <div class="stat-value" id="stHumidity">–</div>
      <div class="stat-bar"><div class="stat-fill" id="stHumidityBar"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Wind</div>
      <div class="stat-value" id="stWind">–</div>
      <div class="wind-dir" id="stWindDir"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pressure</div>
      <div class="stat-value" id="stPressure">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Visibility</div>
      <div class="stat-value" id="stVis">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Clouds</div>
      <div class="stat-value" id="stClouds">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Air Quality</div>
      <div class="stat-value" id="stAqi">–</div>
      <div class="aqi-label" id="stAqiLabel">–</div>
    </div>
  </section>

  <!-- ── 7-DAY FORECAST ─────────────────────────────────────────────────── -->
  <section class="card forecast-card" id="forecastCard">
    <div class="card-title">7-Day Forecast</div>
    <div class="forecast-grid" id="forecastGrid"></div>
  </section>

  <!-- ── HOURLY DETAIL (click a day to expand) ─────────────────────────── -->
  <section class="card hourly-card hidden" id="hourlyCard">
    <div class="card-title hourly-title">
      <span id="hourlyDate">Hourly Detail</span>
      <button class="close-btn" id="closeHourly">✕</button>
    </div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
    <!-- Rain Chart -->
    <div class="rain-chart-wrap">
      <div class="rain-chart-label">Rain probability (%) per hour</div>
      <canvas id="rainCanvas" height="90"></canvas>
    </div>
  </section>

  <!-- ── AQI DETAILS ─────────────────────────────────────────────────────── -->
  <section class="card aqi-card" id="aqiCard">
    <div class="card-title">Air Quality Components</div>
    <div class="aqi-grid" id="aqiGrid"></div>
  </section>

  <!-- ── MAP ────────────────────────────────────────────────────────────── -->
  <section class="card map-card" id="mapCard">
    <div class="card-title">Location</div>
    <div id="mapFrame"></div>
  </section>

</main>

<!-- ── FOOTER ──────────────────────────────────────────────────────────────── -->
<footer class="footer">
  Data: OpenWeatherMap · Built with SkyLens
</footer>

<script src="app.js"></script>
</body>
</html>
